plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    compileSdk flutter.compileSdkVersion
    namespace = "io.anyline.flutter.examples"

    ndkVersion '25.1.8937393' // Replace this with the version you're using

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }


    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "io.anyline.flutter.examples"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode  flutter.versionCode
        versionName  flutter.versionName
    }

    packagingOptions {
        aaptOptions {
            // Enter any modules into "used_modules" you would like to keep and use
            def used_modules = [
                    "module_anyline_ocr",
                    "module_barcode",
                    "module_document",
                    "module_energy",
                    "module_id",
                    "module_license_plate",
                    "module_tire"
            ].toList()

            // Below is the full list of modules
            def all_modules = [
                    "module_anyline_ocr",
                    "module_barcode",
                    "module_document",
                    "module_energy",
                    "module_id",
                    "module_license_plate",
                    "module_tire"
            ].toList()

            // All used modules are kept, the rest are discarded (to shrink your app)
            all_modules.removeAll(used_modules)

            def all_removed_modules = all_modules.join(":")
            ignoreAssetsPattern all_removed_modules
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Google ML Kit is opt-in: the Anyline SDK declares it compileOnly and does not export it.
    // Left commented to show integrators where the dependency goes without adding it. None of the
    // example scan view configs set faceDetectionEnabled, so this app does not need ML Kit.
    // Uncomment this line to enable face detection on Universal ID / MRZ.
//    implementation 'com.google.mlkit:face-detection:16.1.7'    // for faceDetectionEnabled
}

flutter {
    source '../..'
}
